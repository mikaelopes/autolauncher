name: Gerar APK

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|Could not|Failed to|> " build.log | grep -v "^> Task" | head -25 | while IFS= read -r line; do
              echo "::error title=Build::$line"
            done
            exit 1
          fi

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Painel.apk

      - name: Conferir assinatura
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          SHA=$($BT/apksigner verify --print-certs Painel.apk | grep "SHA-256" | head -1 | awk '{print $NF}')
          VER=$($BT/aapt dump badging Painel.apk | grep -o "versionCode='[0-9]*' versionName='[^']*'")
          echo "::notice title=Assinatura::$VER cert=$SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: Painel-apk
          path: Painel.apk

      - name: Publicar release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          VN=$($BT/aapt dump badging Painel.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          TAG="v$VN"
          cp Painel.apk "Painel-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Painel.apk "Painel-$TAG.apk" --clobber
          else
            gh release create "$TAG" Painel.apk "Painel-$TAG.apk" \
              --target "$GITHUB_SHA" --latest \
              --title "Painel $TAG" \
              --notes "Baixe direto na central: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Painel.apk"
          fi
