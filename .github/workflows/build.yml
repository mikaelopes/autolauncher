name: Gerar APK

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Painel.apk

      - name: Conferir assinatura
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          SHA=$($BT/apksigner verify --print-certs Painel.apk | grep "SHA-256" | head -1 | awk '{print $NF}')
          VER=$($BT/aapt dump badging Painel.apk | grep -o "versionCode='[0-9]*' versionName='[^']*'")
          echo "::notice title=Assinatura::$VER cert=$SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: Painel-apk
          path: Painel.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp Painel.apk "Painel-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Painel-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "Painel-${TAG}.apk" \
              --title "Painel ${TAG}" \
              --notes "Launcher para central multimídia 1280×800. Baixe o Painel-${TAG}.apk abaixo, instale na central e escolha Painel como tela inicial padrão."
          fi
